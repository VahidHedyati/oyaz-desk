name: Build OyazDesk Client

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-windows:
    name: Build Windows x64 Portable
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Purge RustDesk References & Inject Vahid Hedyati Branding
        shell: bash
        run: |
          echo "Starting Comprehensive White-labeling..."
          
          # ۱. تنظیمات سرور و آیکون‌ها
          cp branding/config.rs libs/hbb_common/src/config.rs 2>/dev/null || true
          cp branding/icon.ico res/icon.ico 2>/dev/null || true
          mkdir -p flutter/windows/runner/resources
          cp branding/icon.ico flutter/windows/runner/resources/app_icon.ico 2>/dev/null || true

          # ۲. تزریق لوگوهای ایاز
          if [ -f "branding/logo.png" ]; then
            cp -f branding/logo.png flutter/assets/logo.png
            cp -f branding/logo.png flutter/assets/logo_light.png
            cp -f branding/logo.png flutter/assets/logo_dark.png
            cp -f branding/logo.png flutter/assets/icon.png
          fi
          if [ -f "branding/logo.svg" ]; then
            cp -f branding/logo.svg flutter/assets/logo.svg
            cp -f branding/logo.svg flutter/assets/icon.svg
          fi

          # ۳. پاک‌سازی تمام متادیتای باینری در فایل‌های Rust
          find . -type f \( -name "*.rs" -o -name "*.toml" -o -name "*.rc" \) -exec sed -i 's/RustDesk Remote Desktop/OyazDesk Remote Support/g' {} + 2>/dev/null || true
          find . -type f \( -name "*.rs" -o -name "*.toml" -o -name "*.rc" \) -exec sed -i 's/Copyright © 2026 Purslane Tech Pte. Ltd./Copyright © 2026 Vahid Hedyati (vahid.hedyati.ir)/g' {} + 2>/dev/null || true
          find . -type f \( -name "*.rs" -o -name "*.toml" -o -name "*.rc" \) -exec sed -i 's/Purslane Tech Pte. Ltd./Vahid Hedyati/g' {} + 2>/dev/null || true
          find . -type f \( -name "*.rs" -o -name "*.toml" -o -name "*.rc" \) -exec sed -i 's/res.set("ProductName", "RustDesk")/res.set("ProductName", "OyazDesk")/g' {} + 2>/dev/null || true
          find . -type f \( -name "*.rs" -o -name "*.toml" -o -name "*.rc" \) -exec sed -i 's/rustdesk.exe/OyazDesk.exe/g' {} + 2>/dev/null || true

          # ۴. پاک‌سازی تمام لینک‌ها و متون RustDesk در رابط کاربری فلاتر
          find flutter/ -type f -name "*.dart" -exec sed -i 's|https://rustdesk.com/privacy.html|https://vahid.hedyati.ir|g' {} + 2>/dev/null || true
          find flutter/ -type f -name "*.dart" -exec sed -i 's|https://rustdesk.com/docs|https://vahid.hedyati.ir|g' {} + 2>/dev/null || true
          find flutter/ -type f -name "*.dart" -exec sed -i 's|https://rustdesk.com|https://vahid.hedyati.ir|g' {} + 2>/dev/null || true
          find flutter/ -type f -name "*.dart" -exec sed -i 's|https://github.com/rustdesk/rustdesk|https://github.com/VahidHedyati/oyaz-desk|g' {} + 2>/dev/null || true
          
          # ۵. حذف کامل پیام "For faster connection, please set up your own server"
          find flutter/ -type f \( -name "*.dart" -o -name "*.json" \) -exec sed -i 's|For faster connection, please set up your own server||g' {} + 2>/dev/null || true
          find flutter/ -type f \( -name "*.dart" -o -name "*.json" \) -exec sed -i 's|setup_server_tip||g' {} + 2>/dev/null || true

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: Install Build Dependencies & VCPKG Codecs
        shell: pwsh
        run: |
          choco install llvm yasm -y
          cd C:\vcpkg
          .\vcpkg.exe install --classic --triplet x64-windows-static libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static

      - name: Generate Flutter Rust Bridge
        shell: pwsh
        run: |
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          cd flutter
          flutter pub get
          cd ..
          New-Item -ItemType Directory -Force -Path flutter/macos/Runner, flutter/ios/Runner
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          Copy-Item ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Compile OyazDesk
        shell: bash
        run: |
          python3 build.py --flutter

      - name: Prepare and Sign Executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          $packer = Get-ChildItem -Path . -Filter "*portable_packer.exe" -Recurse | Select-Object -First 1
          if ($packer) {
            Copy-Item $packer.FullName -Destination "output\OyazDesk.exe" -Force
          } else {
            $fallback = Get-ChildItem -Path . -Filter "rustdesk.exe" -Recurse | Select-Object -First 1
            Copy-Item $fallback.FullName -Destination "output\OyazDesk.exe" -Force
          }

          Write-Host "Creating Code Signing Certificate for Vahid Hedyati..."
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Vahid Hedyati, O=Vahid Hedyati, E=vahid@hedyati.ir" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          $password = ConvertTo-SecureString -String "OyazDesk2026" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "output\temp_sign.pfx" -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath "output\VahidHedyati-RootCA.cer" | Out-Null

          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -Last 1).FullName
          if (-not $signtool) {
            $signtool = (Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -Last 1).FullName
          }

          if ($signtool) {
            Write-Host "Signing OyazDesk.exe with Publisher: Vahid Hedyati..."
            & $signtool sign /f "output\temp_sign.pfx" /p "OyazDesk2026" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "output\OyazDesk.exe"
          }

          Remove-Item "output\temp_sign.pfx" -Force -ErrorAction SilentlyContinue
          Get-ChildItem output\

      - name: Upload Signed OyazDesk
        uses: actions/upload-artifact@v4
        with:
          name: OyazDesk-v1.0-Windows-x64
          path: output/