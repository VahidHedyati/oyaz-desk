name: Build OyazDesk Enterprise Installer

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-windows:
    name: Build Windows x64 Installer
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Native OyazDesk Branding & Configuration
        shell: bash
        run: |
          echo "Applying OyazDesk parameters and clean enterprise UI..."
          
          # ۱. تنظیمات سرور و تغییر سراسری APP_NAME به OyazDesk
          sed -i 's/"rustdesk"/"OyazDesk"/g' branding/config.rs 2>/dev/null || true
          cp branding/config.rs libs/hbb_common/src/config.rs 2>/dev/null || true
          sed -i 's/"rustdesk"/"OyazDesk"/g' libs/hbb_common/src/config.rs 2>/dev/null || true

          # ۲. تنظیم آیکون‌ها و لوگوی اختصاصی
          cp branding/icon.ico res/icon.ico 2>/dev/null || true
          mkdir -p flutter/windows/runner/resources
          cp branding/icon.ico flutter/windows/runner/resources/app_icon.ico 2>/dev/null || true

          if [ -f "branding/logo.png" ]; then
            cp -f branding/logo.png flutter/assets/logo.png
            cp -f branding/logo.png flutter/assets/logo_light.png
            cp -f branding/logo.png flutter/assets/logo_dark.png
            cp -f branding/logo.png flutter/assets/icon.png
          fi
          if [ -f "branding/logo.svg" ]; then
            cp -f branding/logo.svg flutter/assets/logo.svg
            cp -f branding/logo.svg flutter/assets/icon.svg
          fi

          # ۳. یکسان‌سازی نام باینری در فلاتر و منابع ویندوز
          sed -i 's/set(BINARY_NAME "rustdesk")/set(BINARY_NAME "OyazDesk")/g' flutter/windows/CMakeLists.txt 2>/dev/null || true
          sed -i 's/L"rustdesk"/L"OyazDesk"/g' flutter/windows/runner/main.cpp 2>/dev/null || true
          sed -i 's/L"RustDesk"/L"OyazDesk"/g' flutter/windows/runner/main.cpp 2>/dev/null || true
          sed -i 's/rustdesk.exe/OyazDesk.exe/g' flutter/windows/runner/Runner.rc 2>/dev/null || true
          sed -i 's/RustDesk/OyazDesk/g' flutter/windows/runner/Runner.rc 2>/dev/null || true

          # ۴. حذف عبارت راه‌اندازی سرور از نوار وضعیت فلاتر
          find flutter/assets/translations/ -type f -name "*.json" -exec sed -i 's/"setup_server_tip": "[^"]*"/"setup_server_tip": ""/g' {} + 2>/dev/null || true
          find flutter/ -type f -name "*.dart" -exec sed -i 's|For faster connection, please set up your own server||g' {} + 2>/dev/null || true

          # ۵. متادیتا و کپی‌رایت سازنده
          find . -type f \( -name "*.toml" -o -name "*.rc" \) -exec sed -i 's/RustDesk Remote Desktop/OyazDesk Remote Support/g' {} + 2>/dev/null || true
          find . -type f \( -name "*.toml" -o -name "*.rc" \) -exec sed -i 's/Purslane Tech Pte. Ltd./Vahid Hedyati/g' {} + 2>/dev/null || true
          find . -type f \( -name "*.toml" -o -name "*.rc" \) -exec sed -i 's/Copyright © 2026 Purslane Tech Pte. Ltd./Copyright © 2026 Vahid Hedyati (vahid.hedyati.ir)/g' {} + 2>/dev/null || true

          # ۶. اصلاح پیوندها به سایت شخصی
          find flutter/ -type f -name "*.dart" -exec sed -i 's|https://rustdesk.com/privacy.html|https://vahid.hedyati.ir|g' {} + 2>/dev/null || true
          find flutter/ -type f -name "*.dart" -exec sed -i 's|https://rustdesk.com|https://vahid.hedyati.ir|g' {} + 2>/dev/null || true
          find flutter/ -type f -name "*.dart" -exec sed -i 's|https://github.com/rustdesk/rustdesk|https://github.com/VahidHedyati/oyaz-desk|g' {} + 2>/dev/null || true

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: Install Build Dependencies, Inno Setup & VCPKG Codecs
        shell: pwsh
        run: |
          choco install llvm yasm innosetup -y
          cd C:\vcpkg
          .\vcpkg.exe install --classic --triplet x64-windows-static libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static

      - name: Generate Flutter Rust Bridge
        shell: pwsh
        run: |
          $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          cd flutter
          flutter pub get
          cd ..
          New-Item -ItemType Directory -Force -Path flutter/macos/Runner, flutter/ios/Runner
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          Copy-Item ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Compile OyazDesk Release Payload
        shell: bash
        run: |
          python3 build.py --flutter

      - name: Package with Inno Setup & Sign Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, output

          # جمع‌آوری خروجی خام فلاتر (شامل باینری OyazDesk.exe، DLLها و دیتا)
          $flutterRelease = Get-ChildItem -Path "flutter\build\windows" -Filter "Release" -Directory -Recurse | Select-Object -First 1
          if ($flutterRelease) {
            Write-Host "Staging Flutter build from: $($flutterRelease.FullName)" -ForegroundColor Green
            Copy-Item -Path "$($flutterRelease.FullName)\*" -Destination "dist" -Recurse -Force
          } else {
            Write-Host "Fallback staging from raw artifacts..." -ForegroundColor Yellow
            Copy-Item -Path "flutter\build\windows\runner\Release\*" -Destination "dist" -Recurse -Force
          }

          # تولید گواهی دیجیتال اختصاصی با ایمیل رسمی vahidhedyati@gmail.com
          Write-Host "Creating Certificate with vahidhedyati@gmail.com..."
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Vahid Hedyati, O=Vahid Hedyati, E=vahidhedyati@gmail.com" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          $password = ConvertTo-SecureString -String "OyazDesk2026" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "output\temp_sign.pfx" -Password $password | Out-Null
          
          # ذخیره فایل سرتیفیکیت در داخل سورس نصاب جهت نصب خودکار در سیستم مقصد
          Export-Certificate -Cert $cert -FilePath "dist\VahidHedyati-RootCA.cer" | Out-Null
          Export-Certificate -Cert $cert -FilePath "output\VahidHedyati-RootCA.cer" | Out-Null

          # کامپایل فایل نصبی استاندارد با Inno Setup
          Write-Host "Compiling OyazDesk-Setup-v1.0.exe via Inno Setup..."
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

          # امضای نهایی فایل نصبی و باینری با SignTool ۶۴ بیتی
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -Last 1).FullName
          if (-not $signtool) {
            $signtool = (Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -Last 1).FullName
          }

          if ($signtool) {
            Write-Host "Signing Installer with Publisher: Vahid Hedyati..."
            & $signtool sign /f "output\temp_sign.pfx" /p "OyazDesk2026" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "output\OyazDesk-Setup-v1.0.exe"
          }

          Remove-Item "output\temp_sign.pfx" -Force -ErrorAction SilentlyContinue
          Get-ChildItem output\

      - name: Upload Enterprise Installer
        uses: actions/upload-artifact@v4
        with:
          name: OyazDesk-Enterprise-Installer-x64
          path: output/OyazDesk-Setup-v1.0.exe